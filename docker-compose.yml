version: "3.8"
services:
  mongo:
    image: mongo:6
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes:
      - mongo-data:/data/db
  app:
    build: .
    depends_on: ["mongo"]
    ports: ["8080:8080"]
    environment:
      - MONGO_URI=mongodb://mongo:27017/authdb
volumes:
  mongo-data:
